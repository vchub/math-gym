<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Math Gym Logo">
  <title>Math Gym Icon</title>
  <defs>
    <style>
      .brain { fill: #A3D5FF; stroke: #4285F4; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .dumbbell { fill: #B0B0B0; stroke: #757575; stroke-width: 2; }
    </style>
  </defs>

  <g transform="rotate(-30 70 70)">
    <rect x="58" y="68.5" width="24" height="3" rx="1.5" class="dumbbell"/>
    <circle cx="54" cy="70" r="8" class="dumbbell"/>
    <circle cx="86" cy="70" r="8" class="dumbbell"/>
  </g>

  <path class="brain" d="
    M 50,20
    C 25,20 15,40 25,60
    C 15,65 15,80 30,85
    C 35,90 45,90 50,85
    C 50,80 50,75 50,70
    V 85
    C 55,90 65,90 70,85
    C 85,80 85,65 75,60
    C 85,40 75,20 50,20
    Z
  "/>
  <path d="M 50,25 V 70" stroke="#4285F4" stroke-width="2.5" fill="none" />
  <path d="M 35,35 C 40,55 45,45 45,65" stroke="#4285F4" stroke-width="2" fill="none"/>
  <path d="M 65,35 C 60,55 55,45 55,65" stroke="#4285F4" stroke-width="2" fill="none"/>
</svg>
